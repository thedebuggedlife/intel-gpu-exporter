name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-bot
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ vars.PUBLISH_ENABLED != 'true' }}

  decide:
    name: decide
    needs: release-please
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      number: ${{ steps.decide.outputs.number }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether the release PR can merge
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY_OWNER}:release-please--branches--main&state=open" \
            --jq '.[0] // empty | {number, title, sha: .head.sha}')
          if [ -z "$pr" ]; then
            echo "no open release PR"
            echo "decision=none" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(jq --raw-output .title <<<"$pr")
          if scripts/release.py check "${title##* }" --manifest .release-please-manifest.json; then
            decision=merge
          else
            decision=review
          fi
          {
            echo "decision=$decision"
            echo "number=$(jq --raw-output .number <<<"$pr")"
            echo "sha=$(jq --raw-output .sha <<<"$pr")"
          } >>"$GITHUB_OUTPUT"

  auto-merge:
    name: auto-merge
    needs: decide
    if: vars.PUBLISH_ENABLED == 'true' && needs.decide.outputs.decision != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-bot
    permissions: {}
    env:
      DECISION: ${{ needs.decide.outputs.decision }}
      HEAD_SHA: ${{ needs.decide.outputs.sha }}
      NUMBER: ${{ needs.decide.outputs.number }}
    steps:
      - name: Check the decision
        run: |
          if [[ ! "$DECISION" =~ ^(merge|review)$ || ! "$NUMBER" =~ ^[1-9][0-9]*$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "refusing the decision" >&2
            exit 1
          fi

      - name: Create app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the release PR
        if: needs.decide.outputs.decision == 'merge'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"

      - name: Hold the PR for review
        if: needs.decide.outputs.decision == 'review'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          armed=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')
          # GitHub only disarms a PR when someone without write access pushes, and the app has write access
          if [ "$armed" = true ]; then
            gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/requested_reviewers" \
            --field 'reviewers[]=avargaskun' >/dev/null

  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_ENABLED == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
