name: gate

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/actions/**
      - .github/workflows/gate.yaml
      - .github/workflows/publish.yaml
      - Dockerfile
      - grype-ignore.toml
      - intel_gpu_exporter/**
      - requirements.txt
      - scripts/**
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build, which also names the image version
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: Index digest of the image, read in the job that built it
        value: ${{ jobs.gate-build.outputs.digest }}

permissions: {}

jobs:
  gate-tests:
    name: gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Lint and test
        uses: ./.github/actions/lint-and-test

  # This job's file is what gets pushed, so nothing here installs packages or restores a cache
  gate-build:
    name: gate-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      config: ${{ steps.identity.outputs.config }}
      digest: ${{ steps.identity.outputs.digest }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read image metadata
        id: metadata
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "version=${REF#v}" >>"$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: false
          outputs: type=oci,dest=image.tar
          tags: intel-gpu-exporter:gate
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version || 'dev' }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

      - name: Read the image's identity
        id: identity
        run: |
          echo "config=sha256:$(skopeo inspect --raw --config oci-archive:image.tar | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "digest=sha256:$(skopeo inspect --raw oci-archive:image.tar | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0

  gate-verify:
    name: gate-verify
    needs: gate-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CONFIG_DIGEST: ${{ needs.gate-build.outputs.config }}
      DIGEST: ${{ needs.gate-build.outputs.digest }}
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate-build.outputs.revision }}
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the archive into Docker
        run: |
          index="sha256:$(skopeo inspect --raw oci-archive:image.tar | sha256sum | cut -d' ' -f1)"
          if [ "$index" != "$DIGEST" ]; then
            echo "downloaded $index, but the build produced $DIGEST" >&2
            exit 1
          fi
          skopeo copy oci-archive:image.tar docker-archive:loadable.tar:intel-gpu-exporter:gate
          docker load --input loadable.tar
          rm loadable.tar
          loaded=$(docker image inspect --format '{{.Id}}' intel-gpu-exporter:gate)
          if [ "$loaded" != "$CONFIG_DIGEST" ]; then
            echo "loaded $loaded, but the archive's config is $CONFIG_DIGEST" >&2
            exit 1
          fi

      - name: Test image
        run: scripts/test-image.sh intel-gpu-exporter:gate

      - name: Record the image's contents
        run: |
          mkdir built
          scripts/image_lock.py intel-gpu-exporter:gate >built/image.lock

      - name: Upload the image's contents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-lock
          path: built/image.lock
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Scan image
        env:
          SCAN_FORCE_FAIL: ${{ vars.SCAN_FORCE_FAIL }}
        run: scripts/scan-image.sh image.tar "$CONFIG_DIGEST" built/grype.sarif

      - name: Upload the scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif
          path: built/grype.sarif
          if-no-files-found: warn
          overwrite: true
          retention-days: 1

      - name: Rehearse the push
        run: |
          scripts/release.py publish --repository localhost:5000/rehearsal \
            --archive image.tar --tag v999.0.0 --expected-digest "$DIGEST"
          tags=$(skopeo list-tags --tls-verify=false docker://localhost:5000/rehearsal | jq --compact-output '.Tags | sort')
          if [ "$tags" != '["999.0","999.0.0","latest"]' ]; then
            echo "the registry holds $tags" >&2
            exit 1
          fi
