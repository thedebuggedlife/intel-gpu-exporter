name: report

# Runs from main with no access to the key, and reads the finished run from the event
on:
  workflow_run:
    workflows:
      - dependabot-decide
      - dependabot-merge
      - publish
      - rebuild
      - release
    types:
      - completed

permissions: {}

jobs:
  track-failure:
    name: track-failure
    # head_branch is the PR's on pull_request_target, and a dispatch from elsewhere is a dry run
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.event == 'pull_request_target')
      && !contains(fromJSON('["success", "skipped", "neutral"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: track-failure
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: scripts/track-failure.sh

  sarif:
    name: sarif
    if: >-
      github.event.workflow_run.name == 'rebuild'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download the scan results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif
          path: scan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scan/grype.sarif
          category: grype
          ref: refs/heads/main
          sha: ${{ github.event.workflow_run.head_sha }}
