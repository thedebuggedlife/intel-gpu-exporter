name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and test
        uses: ./.github/actions/lint-and-test

  image-test:
    name: image-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --platform linux/amd64 -t intel-gpu-exporter .

      - name: Test image
        run: scripts/test-image.sh intel-gpu-exporter
